
version: v2

modules:
  - path: istad-common/istad-common-grpc-contract/src/main/proto

deps:
  - buf.build/bufbuild/protovalidate

lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
    - FIELD_LOWER_SNAKE_CASE
    - ENUM_VALUE_PREFIX

breaking:
  use:
    - FILE
