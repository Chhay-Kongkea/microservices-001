syntax = "proto3";

package payment;

import "buf/validate/validate.proto";

option java_multiple_files = true;
option java_outer_classname = "PaymentProto";
option java_package = "kh.edu.istad.common.grpc.payment";

service PaymentService {
  rpc PayOrder(PayOrderRequest) returns (PayOrderResponse);
}

message PayOrderRequest {
  string orderId = 1 [(buf.validate.field).string.uuid = true];

  string customerId = 2 [(buf.validate.field).string.uuid = true];

  string price = 3 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
  }];
}

message PayOrderResponse {
  string paymentId = 1;
  string orderId = 2;
  string price = 3;
  PaymentStatusGrpc status = 4;
  string message = 5;
}

enum PaymentStatusGrpc {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_COMPLETED = 1;
  PAYMENT_STATUS_CANCELED = 2;
  PAYMENT_STATUS_FAILED = 3;
}
