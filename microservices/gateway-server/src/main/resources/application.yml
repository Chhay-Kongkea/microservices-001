server:
  port: 9999

spring:
  application:
    name: gateway-service

  profiles:
    active: dev

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - SaveSession
          discovery:
            locator:
              enabled: true
          routes:
            - id: my-order-service
              uri: lb://order-service
              predicates:
                - Path=/my-orders/**
              filters:
                - RewritePath=/my-orders/?(?<segment>.*), /$\{segment}
            #                - SaveSession
            - id: json-placeholder
              uri: https://jsonplaceholder.typicode.com
              predicates:
                - Path=/jph/**
              filters:
                - RewritePath=/jph/?(?<segment>.*), /$\{segment}
            - id: next.js
              uri: http://localhost:3000
              predicates:
                  - Path=/**



          consul:
            host: localhost
            port: 8500
            discovery:
              register: true
              health-check-url: http://host.docker.internal:${server.port}/actuator/health
              prefer-ip-address: true
              service-name: ${spring.application.name}
              instance-id: ${spring.application.name}-${random.value}



    consul:
      host: localhost
      port: 8500
      discovery:
        register: true
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        prefer-ip-address: true
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}-${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway

  endpoint:
    gateway:
      access: read-only

