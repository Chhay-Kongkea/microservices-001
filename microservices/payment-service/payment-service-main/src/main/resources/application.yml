server:
  port: 9093

spring:
  application:
    name: payment-service


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true



customer-service:
  url: ${CUSTOMER_SERVICE_URL:http://localhost:9090}
order-service:
  url: ${ORDER_SERVICE_URL:http://localhost:9092}
