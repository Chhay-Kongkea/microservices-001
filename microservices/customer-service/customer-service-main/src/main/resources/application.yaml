server:
  port: 9090

spring:
  application:
    name: customer-service

  cloud:
    consul:
      discovery:
        instance-id: ${spring.application.name}-${random.value}
        health-check-url: http://host.docker.internal:9192/actuator/health


  mongodb:
    host: localhost
    port: 2026
    username: mongodb
    password: mongodb
    database: db_customer
    authentication-database: admin