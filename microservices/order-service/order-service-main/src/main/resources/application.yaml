
spring:
  application:
    name: order-service
  grpc:
    client:
      channel:
        payment:
          target: static://localhost:9091
  profiles:
    active: dev
  config:
    import: "optional:consul:"
  cloud:
    consul:
      config:
        enabled: true
        format: yaml
        watch:
          enabled: true
      discovery:
        register: true
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        health-check-path: /actuator/health
        prefer-ip-address: true
        service-name: order-service
        instance-id: ${spring.application.name}-${random.value}
  r2dbc:
    url: r2dbc:postgresql://localhost:9543/db_order
    username: iteuser
    password: kea1213
  liquibase:
    enabled: true
    url: jdbc:postgresql://localhost:9543/db_order
    driver-class-name: org.postgresql.Driver
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    user: iteuser
    password: kea1213

global:
  version: "1.0.0"
server:
  port: 20000

  http:
    serviceclient:
      customer:
        base-url: http://customer-service
