plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kh.edu.istad.common'
version = '1.0-SNAPSHOT'



repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}
