volumes:
  mongodb_vol:
networks:
  ite-net:
    external: true

services:
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    ports:
      - "2026:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongodb
      - MONGO_INITDB_ROOT_PASSWORD=mongodb
    volumes:
      - mongodb_vol:/data/db
    networks:
      ite-net:
